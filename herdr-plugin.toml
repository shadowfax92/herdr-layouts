id = "shadowfax.layouts"
name = "Herdr Layouts"
version = "0.1.0"
description = "Tmux-style narrow splits and focused-pane equalization."
min_herdr_version = "0.7.5"
platforms = ["macos"]

[[build]]
command = ["cargo", "build", "--release", "--locked"]

[[actions]]
id = "split-left-30"
title = "Split 30% pane on the left"
description = "Create and focus a pane occupying 30% on the left."
contexts = ["pane"]
command = ["./target/release/herdr-layouts", "split", "left"]

[[actions]]
id = "split-right-30"
title = "Split 30% pane on the right"
description = "Create and focus a pane occupying 30% on the right."
contexts = ["pane"]
command = ["./target/release/herdr-layouts", "split", "right"]

[[actions]]
id = "equalize"
title = "Spread nearby panes evenly"
description = "Equalize the focused pane and adjacent panes in the same direction."
contexts = ["pane"]
command = ["./target/release/herdr-layouts", "equalize"]
